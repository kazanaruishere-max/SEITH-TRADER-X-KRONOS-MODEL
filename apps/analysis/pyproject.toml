[project]
name = "seith-analysis"
version = "0.1.0"
description = "SEITH analysis service: TradingAgents (Groq) + Kronos inference + backtest runner"
requires-python = ">=3.12"
dependencies = [
    "seith-core",
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
    "vectorbt==1.1.0",
    "tradingagents",
]

[tool.uv.sources]
seith-core = { path = "../../packages/seith-core", editable = true }
tradingagents = { path = "../../vendor/TradingAgents", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seith_analysis"]
