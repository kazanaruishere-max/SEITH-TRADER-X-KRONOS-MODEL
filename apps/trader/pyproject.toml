[project]
name = "seith-trader"
version = "0.1.0"
description = "SEITH trader node: nautilus_trader execution engine"
requires-python = ">=3.12"
dependencies = [
    "seith-core",
    "nautilus_trader==1.231.0",
]

[tool.uv.sources]
seith-core = { path = "../../packages/seith-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seith_trader"]
