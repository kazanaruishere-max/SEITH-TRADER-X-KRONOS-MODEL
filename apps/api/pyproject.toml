[project]
name = "seith-api"
version = "0.1.0"
description = "SEITH core API: FastAPI orchestrator hub + Telegram bot"
requires-python = ">=3.12"
dependencies = [
    "seith-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiogram>=3.15",
    "httpx>=0.27",
]

[tool.uv.sources]
seith-core = { path = "../../packages/seith-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seith_api"]
