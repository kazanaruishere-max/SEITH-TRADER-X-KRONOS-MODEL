[project]
name = "seith-api"
version = "0.1.0"
description = "SEITH core API: FastAPI orchestrator hub + Telegram bot"
requires-python = ">=3.12,<3.14"
dependencies = [
    "seith-core",
    "seith-analysis",
    "seith-trader",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiogram>=3.15",
    "httpx>=0.27",
]

[tool.uv.sources]
seith-core = { path = "../../packages/seith-core", editable = true }
seith-analysis = { path = "../../apps/analysis", editable = true }
seith-trader = { path = "../../apps/trader", editable = true }

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seith_api"]
